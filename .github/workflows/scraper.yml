name: Hospital Wait Time Scraper

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Configure ENV
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $GITHUB_ENV
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
          echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}" >> $GITHUB_ENV

      - name: Run the main script
        run: python -m scraper.main

      # Refresh the site's cached home and hospital pages. The secret goes in a header (not the
      # URL, which ends up in logs); --fail makes a rejected call fail the step instead of passing.
      - name: Revalidate Next.js Page
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $REVALIDATE_SECRET"             "https://er-watch.ca/api/revalidate"
